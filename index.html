<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buni Hub & DTBi - Social Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .logo p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      margin: 24px 0;
    }
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.2s ease;
      margin-bottom: 10px;
    }
    .link:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.15);
      transform: translateX(4px);
    }
    .link svg { flex-shrink: 0; }
    .link-info { flex: 1; min-width: 0; }
    .link-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
    .link-handle { color: rgba(255,255,255,0.4); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .instagram-link:hover { border-left: 3px solid #E1306C; }
    .linkedin-link:hover { border-left: 3px solid #0A66C2; }
  </style>
</head>
