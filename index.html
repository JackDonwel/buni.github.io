<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buni Hub & DTBi - Social Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0A0A0A;
      --white: #FFFFFF;
      --gold: #D4A843;
      --gold-light: #E8C56D;
      --blue: #1E3A5F;
      --blue-light: #2D5A8A;
      --blue-dark: #0F1F33;
    }
    /* Animated Background */
    .bg-animation {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-gradient {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(30, 58, 95, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, rgba(212, 168, 67, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse 100% 100% at 50% 50%, var(--blue-dark) 0%, var(--black) 70%, var(--blue-dark) 100%);
      animation: gradientShift 20s ease-in-out infinite;
    }
    @keyframes gradientShift {
      0%, 100% { 
        background-position: 20% 10%, 80% 90%, 50% 50%;
        opacity: 1;
      }
      50% { 
        background-position: 30% 20%, 70% 80%, 50% 50%;
        opacity: 0.85;
      }
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--gold);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp 15s infinite ease-in-out;
      box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold);
    }
    .particle:nth-child(2) { left: 10%; animation-delay: 0s; animation-duration: 18s; width: 3px; height: 3px; }
    .particle:nth-child(3) { left: 20%; animation-delay: 2s; animation-duration: 16s; width: 5px; height: 5px; }
    .particle:nth-child(4) { left: 35%; animation-delay: 4s; animation-duration: 20s; width: 2px; height: 2px; }
    .particle:nth-child(5) { left: 50%; animation-delay: 1s; animation-duration: 17s; width: 4px; height: 4px; }
    .particle:nth-child(6) { left: 65%; animation-delay: 3s; animation-duration: 19s; width: 3px; height: 3px; }
    .particle:nth-child(7) { left: 80%; animation-delay: 5s; animation-duration: 15s; width: 5px; height: 5px; }
    .particle:nth-child(8) { left: 90%; animation-delay: 2.5s; animation-duration: 22s; width: 2px; height: 2px; }
    @keyframes floatUp {
      0% { bottom: -20px; opacity: 0; transform: translateX(0) scale(0.5); }
      10% { opacity: 0.6; }
      30% { opacity: 1; transform: translateX(30px) scale(1); }
      70% { opacity: 1; transform: translateX(-30px) scale(1); }
      90% { opacity: 0.6; }
      100% { bottom: 110vh; opacity: 0; transform: translateX(0) scale(0.5); }
    }
    .gold-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      opacity: 0.1;
      animation: linePulse 8s ease-in-out infinite;
      transform: translateX(-50%);
    }
    @keyframes linePulse {
      0%, 100% { opacity: 0.05; transform: translateX(-50%) scaleY(1); }
      50% { opacity: 0.15; transform: translateX(-50%) scaleY(1.02); }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .card {
      background: linear-gradient(145deg, var(--blue) 0%, var(--blue-dark) 100%);
      border-radius: 20px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      border: 1px solid var(--gold);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 60px rgba(212,168,67,0.1);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }
    .logo::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 16px auto 0;
    }
    .logo h1 {
      color: var(--white);
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .logo p {
      color: var(--gold);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px 0;
    }
    .section {
      margin-bottom: 24px;
    }
    .section-title {
      color: var(--gold);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-title::before,
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: rgba(30, 58, 95, 0.6);
      border-radius: 12px;
      text-decoration: none;
      color: var(--white);
      border: 1px solid rgba(212, 168, 67, 0.2);
      transition: all 0.3s ease;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--gold);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.3s ease;
    }
    .link:hover {
      background: rgba(30, 58, 95, 0.9);
      border-color: var(--gold);
      transform: translateX(6px);
    }
    .link:hover::before {
      transform: scaleY(1);
    }
    .link svg { 
      flex-shrink: 0; 
      transition: transform 0.3s ease;
    }
    .link:hover svg {
      transform: scale(1.1);
    }
    .link-info { flex: 1; min-width: 0; }
    .link-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; color: var(--white); }
    .link-handle { color: var(--gold-light); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .instagram-link:hover { border-color: var(--gold); }
    .linkedin-link:hover { border-color: var(--gold); }
    .instagram-link svg { color: var(--gold); }
    .linkedin-link svg { color: var(--blue-light); }
    .whatsapp-link svg { color: #25D366; }
    .link:hover .whatsapp-link svg { color: var(--gold); }
    .whatsapp-link:hover { border-color: var(--gold); }

    /* Responsive */
    @media (max-width: 480px) {
      body { padding: 16px; align-items: flex-start; min-height: 100vh; }
      .card { 
        padding: 24px 20px; 
        border-radius: 16px; 
        max-width: 100%;
        box-shadow: 0 12px 32px rgba(0,0,0,0.5), 0 0 40px rgba(212,168,67,0.08);
      }
      .logo { margin-bottom: 20px; }
      .logo h1 { font-size: 22px; letter-spacing: 0.5px; }
      .logo p { font-size: 12px; letter-spacing: 2px; }
      .logo::after { width: 40px; margin-top: 12px; }
      .divider { margin: 16px 0; }
      .section { margin-bottom: 16px; }
      .section-title { font-size: 10px; letter-spacing: 2px; margin-bottom: 12px; gap: 6px; }
      .section-title::before, .section-title::after { height: 0.5px; }
      .link { 
        padding: 14px 12px; 
        gap: 12px; 
        border-radius: 10px;
        margin-bottom: 8px;
      }
      .link svg { width: 22px; height: 22px; flex-shrink: 0; }
      .link-name { font-size: 14px; }
      .link-handle { font-size: 11px; white-space: normal; overflow: visible; text-overflow: unset; line-height: 1.3; }
      .link:hover { transform: none; }
      .link:active { transform: scale(0.98); }
      .link::before { display: none; }
      .particle { width: 3px; height: 3px; }
      .particle:nth-child(3) { width: 4px; height: 4px; }
      .particle:nth-child(7) { width: 4px; height: 4px; }
    }

    @media (max-width: 360px) {
      .card { padding: 20px 16px; }
      .logo h1 { font-size: 20px; }
      .link { padding: 12px 10px; gap: 10px; }
      .link svg { width: 20px; height: 20px; }
      .link-name { font-size: 13px; }
      .link-handle { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-gradient, .particle, .gold-line { animation: none; }
      .link, .link svg { transition: none; }
    }
  </style>
</head>
